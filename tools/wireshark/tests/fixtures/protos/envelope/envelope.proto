syntax = "proto3";

package demo.envelope;

import "validate.proto";
import "google/protobuf/any.proto";
import "payloads.proto";

message Envelope {
    uint32 version = 1;
    google.protobuf.Any body = 2 [
        (validate.rules).any.in = "type.googleapis.com/demo.payloads.Ping",
        (validate.rules).any.in = "type.googleapis.com/demo.payloads.Command"
    ];
    demo.payloads.Ping last_ping = 3;
}

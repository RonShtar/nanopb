/*
 * Schema for the validation benchmark: a oneof envelope (the filter
 * dispatches on it) around a telemetry message with nested repeated
 * readings and string rules, roughly what a device protocol looks like.
 */
syntax = "proto3";

import "validate.proto";

message Reading {
    uint32 sensor = 1 [(validate.rules).uint32.lte = 1000];
    float value = 2 [(validate.rules).float = {gte: -100, lte: 100}];
    string unit = 3 [(validate.rules).string = {min_len: 1, max_len: 8}];
}

message Telemetry {
    string device = 1 [(validate.rules).string = {prefix: "dev-", max_len: 31}];
    uint64 seq = 2 [(validate.rules).uint64.gt = 0];
    repeated Reading readings = 3 [(validate.rules).repeated = {min_items: 1, max_items: 8}];
    string contact = 4 [(validate.rules).string.email = true];
}

message Command {
    string name = 1 [(validate.rules).string = {in: ["start", "stop"]}];
    int32 arg = 2 [(validate.rules).int32 = {gte: 0, lte: 100}];
}

message Envelope {
    uint32 version = 1 [(validate.rules).uint32.const_value = 1];
    oneof body {
        Telemetry telemetry = 2;
        Command command = 3;
    }
}

/*
 * --filter=Gateway dispatches on an Any whose payload type comes from
 * payload.proto. The payload's validator lives in payload_validate.c only;
 * gateway_validate.c must not define a second copy of it.
 */
syntax = "proto3";

import "validate.proto";
import "google/protobuf/any.proto";
import "payload.proto";

message Gateway {
    google.protobuf.Any body = 1 [(validate.rules).any = {in: ["type.googleapis.com/Reading"]}];
}

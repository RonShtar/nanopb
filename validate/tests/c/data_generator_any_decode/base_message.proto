syntax = "proto3";

package anydecode;

import "validate.proto";
import "nanopb.proto";
import "google/protobuf/any.proto";

option (validate.validate) = true;

/* Common header carried by every message */
message Header {
    string message_id = 1 [
        (nanopb).max_size = 32,
        (validate.rules).string.min_len = 4,
        (validate.rules).string.max_len = 24
    ];
    uint32 version = 2 [(validate.rules).uint32.const_value = 3];
    /* No string.max_len rule: the generated data must still be clamped to the
     * nanopb storage, otherwise pb_decode() aborts with "string overflow" and
     * every later field is left unset. */
    string origin = 3 [(nanopb).max_size = 8];
    /* No repeated rules either: the item count must respect max_count. */
    repeated uint32 tags = 4 [(nanopb).max_count = 3];
}

/* Payload that is transported inside the google.protobuf.Any field */
message SensorReading {
    string sensor_name = 1 [
        (nanopb).max_size = 32,
        (validate.rules).string.const_value = "temperature"
    ];
    int32 value = 2 [
        (validate.rules).int32.gte = 10,
        (validate.rules).int32.lte = 40
    ];
}

message BaseMessage {
    Header header = 1 [(validate.rules).required = true];
    google.protobuf.Any message = 2 [
        (validate.rules).required = true,
        (validate.rules).any.in = "type.googleapis.com/anydecode.SensorReading"
    ];
}

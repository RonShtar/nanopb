// Stand-in for protovalidate's buf/validate/validate.proto (same package, message
// names, field numbers and extension numbers for what the tests use).
syntax = "proto2";

package buf.validate;

import "google/protobuf/descriptor.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

extend google.protobuf.MessageOptions { optional MessageRules message = 1159; }
extend google.protobuf.OneofOptions { optional OneofRules oneof = 1159; }
extend google.protobuf.FieldOptions {
  optional FieldRules field = 1159;
  optional PredefinedRules predefined = 1160;
}

message Rule {
  optional string id = 1;
  optional string message = 2;
  optional string expression = 3;
}

message MessageRules {
  repeated string cel_expression = 5;
  repeated Rule cel = 3;
  repeated MessageOneofRule oneof = 4;
}

message MessageOneofRule {
  repeated string fields = 1;
  optional bool required = 2;
}

message OneofRules { optional bool required = 1; }

enum Ignore {
  IGNORE_UNSPECIFIED = 0;
  IGNORE_IF_ZERO_VALUE = 1;
  IGNORE_ALWAYS = 3;
}

message FieldRules {
  repeated string cel_expression = 29;
  repeated Rule cel = 23;
  optional bool required = 25;
  optional Ignore ignore = 27;
  oneof type {
    FloatRules float = 1;
    DoubleRules double = 2;
    Int32Rules int32 = 3;
    Int64Rules int64 = 4;
    UInt32Rules uint32 = 5;
    UInt64Rules uint64 = 6;
    SInt32Rules sint32 = 7;
    SInt64Rules sint64 = 8;
    Fixed32Rules fixed32 = 9;
    Fixed64Rules fixed64 = 10;
    SFixed32Rules sfixed32 = 11;
    SFixed64Rules sfixed64 = 12;
    BoolRules bool = 13;
    StringRules string = 14;
    BytesRules bytes = 15;
    EnumRules enum = 16;
    RepeatedRules repeated = 18;
    MapRules map = 19;
    AnyRules any = 20;
    DurationRules duration = 21;
    TimestampRules timestamp = 22;
  }
}

message PredefinedRules { repeated Rule cel = 1; }

message FloatRules { optional float const = 1; oneof less_than { float lt = 2; float lte = 3; } oneof greater_than { float gt = 4; float gte = 5; } repeated float in = 6; repeated float not_in = 7; optional bool finite = 8; repeated float example = 9; }
message DoubleRules { optional double const = 1; oneof less_than { double lt = 2; double lte = 3; } oneof greater_than { double gt = 4; double gte = 5; } repeated double in = 6; repeated double not_in = 7; optional bool finite = 8; repeated double example = 9; }
message Int32Rules { optional int32 const = 1; oneof less_than { int32 lt = 2; int32 lte = 3; } oneof greater_than { int32 gt = 4; int32 gte = 5; } repeated int32 in = 6; repeated int32 not_in = 7; repeated int32 example = 8; }
message Int64Rules { optional int64 const = 1; oneof less_than { int64 lt = 2; int64 lte = 3; } oneof greater_than { int64 gt = 4; int64 gte = 5; } repeated int64 in = 6; repeated int64 not_in = 7; repeated int64 example = 9; }
message UInt32Rules { optional uint32 const = 1; oneof less_than { uint32 lt = 2; uint32 lte = 3; } oneof greater_than { uint32 gt = 4; uint32 gte = 5; } repeated uint32 in = 6; repeated uint32 not_in = 7; repeated uint32 example = 8; }
message UInt64Rules { optional uint64 const = 1; oneof less_than { uint64 lt = 2; uint64 lte = 3; } oneof greater_than { uint64 gt = 4; uint64 gte = 5; } repeated uint64 in = 6; repeated uint64 not_in = 7; repeated uint64 example = 8; }
message SInt32Rules { optional sint32 const = 1; oneof less_than { sint32 lt = 2; sint32 lte = 3; } oneof greater_than { sint32 gt = 4; sint32 gte = 5; } repeated sint32 in = 6; repeated sint32 not_in = 7; repeated sint32 example = 8; }
message SInt64Rules { optional sint64 const = 1; oneof less_than { sint64 lt = 2; sint64 lte = 3; } oneof greater_than { sint64 gt = 4; sint64 gte = 5; } repeated sint64 in = 6; repeated sint64 not_in = 7; repeated sint64 example = 8; }
message Fixed32Rules { optional fixed32 const = 1; oneof less_than { fixed32 lt = 2; fixed32 lte = 3; } oneof greater_than { fixed32 gt = 4; fixed32 gte = 5; } repeated fixed32 in = 6; repeated fixed32 not_in = 7; repeated fixed32 example = 8; }
message Fixed64Rules { optional fixed64 const = 1; oneof less_than { fixed64 lt = 2; fixed64 lte = 3; } oneof greater_than { fixed64 gt = 4; fixed64 gte = 5; } repeated fixed64 in = 6; repeated fixed64 not_in = 7; repeated fixed64 example = 8; }
message SFixed32Rules { optional sfixed32 const = 1; oneof less_than { sfixed32 lt = 2; sfixed32 lte = 3; } oneof greater_than { sfixed32 gt = 4; sfixed32 gte = 5; } repeated sfixed32 in = 6; repeated sfixed32 not_in = 7; repeated sfixed32 example = 8; }
message SFixed64Rules { optional sfixed64 const = 1; oneof less_than { sfixed64 lt = 2; sfixed64 lte = 3; } oneof greater_than { sfixed64 gt = 4; sfixed64 gte = 5; } repeated sfixed64 in = 6; repeated sfixed64 not_in = 7; repeated sfixed64 example = 8; }
message BoolRules { optional bool const = 1; repeated bool example = 2; }
message StringRules {
  optional string const = 1;
  optional uint64 len = 19;
  optional uint64 min_len = 2;
  optional uint64 max_len = 3;
  optional uint64 len_bytes = 20;
  optional uint64 min_bytes = 4;
  optional uint64 max_bytes = 5;
  optional string pattern = 6;
  optional string prefix = 7;
  optional string suffix = 8;
  optional string contains = 9;
  optional string not_contains = 23;
  repeated string in = 10;
  repeated string not_in = 11;
  oneof well_known {
    bool email = 12;
    bool hostname = 13;
    bool ip = 14;
    bool ipv4 = 15;
    bool ipv6 = 16;
    bool uri = 17;
    bool uri_ref = 18;
    bool address = 21;
    bool uuid = 22;
  }
  optional bool strict = 25;
  repeated string example = 34;
}
message BytesRules { optional bytes const = 1; optional uint64 len = 13; optional uint64 min_len = 2; optional uint64 max_len = 3; optional string pattern = 4; optional bytes prefix = 5; optional bytes suffix = 6; optional bytes contains = 7; repeated bytes in = 8; repeated bytes not_in = 9; repeated bytes example = 14; }
message EnumRules { optional int32 const = 1; optional bool defined_only = 2; repeated int32 in = 3; repeated int32 not_in = 4; repeated int32 example = 5; }
message RepeatedRules { optional uint64 min_items = 1; optional uint64 max_items = 2; optional bool unique = 3; optional FieldRules items = 4; }
message MapRules { optional uint64 min_pairs = 1; optional uint64 max_pairs = 2; optional FieldRules keys = 4; optional FieldRules values = 5; }
message AnyRules { repeated string in = 2; repeated string not_in = 3; }
message DurationRules { optional google.protobuf.Duration const = 2; oneof less_than { google.protobuf.Duration lt = 3; google.protobuf.Duration lte = 4; } oneof greater_than { google.protobuf.Duration gt = 5; google.protobuf.Duration gte = 6; } repeated google.protobuf.Duration in = 7; repeated google.protobuf.Duration not_in = 8; }
message TimestampRules { optional google.protobuf.Timestamp const = 2; oneof less_than { google.protobuf.Timestamp lt = 3; google.protobuf.Timestamp lte = 4; bool lt_now = 7; } oneof greater_than { google.protobuf.Timestamp gt = 5; google.protobuf.Timestamp gte = 6; bool gt_now = 8; } optional google.protobuf.Duration within = 9; }
